{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Резюме{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{% static 'main/css/style.css' %}"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Mobile menu toggle -->
    <button
        class="mobile-toggle"
        onclick="document.getElementById('sidebar').classList.toggle('open')"
    >
        <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar navigation -->
    <aside class="sidebar" id="sidebar">

        <!-- Main navigation -->
        <ul class="nav">

            <li>
                <a
                    class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                    href="{% url 'home' %}"
                >
                    <i class="bi bi-house"></i>
                    Главная
                </a>
            </li>

            <li>
                <a
                    class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                    href="{% url 'about' %}"
                >
                    <i class="bi bi-person"></i>
                    Обо мне
                </a>
            </li>

            <li>
                <a
                    class="nav-link {% if request.resolver_match.url_name == 'resume' %}active{% endif %}"
                    href="{% url 'resume' %}"
                >
                    <i class="bi bi-file-earmark-text navicon"></i>
                    Резюме
                </a>
            </li>

            <li>
                <a
                    class="nav-link {% if request.resolver_match.url_name == 'portfolio_list' %}active{% endif %}"
                    href="{% url 'portfolio_list' %}"
                >
                    <i class="bi bi-briefcase"></i>
                    Портфолио
                </a>
            </li>

            <li>
                <a
                    class="nav-link {% if request.resolver_match.url_name == 'contacts' %}active{% endif %}"
                    href="{% url 'contacts' %}"
                >
                    <i class="bi bi-envelope"></i>
                    Контакты
                </a>
            </li>

        </ul>

        <!-- Social media links -->
        <div class="social-links text-center">

            <a href="#" class="github" title="GitHub">
                <i class="bi bi-github"></i>
            </a>

            <a href="#" class="telegram" title="Telegram">
                <i class="bi bi-telegram"></i>
            </a>

            <a href="#" class="linkedin" title="LinkedIn">
                <i class="bi bi-linkedin"></i>
            </a>

        </div>
    </aside>

    <!-- Main content -->
    <div class="main-content">

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            © {% now "Y" %} Владимир Плесовских
        </footer>

    </div>

    <!-- Bootstrap 5 JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
