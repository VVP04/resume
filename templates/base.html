{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Резюме | Владимир Плесовских{% endblock %}</title>

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{% static 'main/css/style.css' %}"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Mobile menu toggle -->
    <button
        class="mobile-toggle"
        onclick="document.getElementById('sidebar').classList.toggle('open')"
    >
        <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar navigation -->
    <aside class="sidebar" id="sidebar">

        <!-- Main navigation -->
        <nav>
            <ul class="nav">
                <li>
                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                        href="{% url 'home' %}"
                    >
                        <i class="bi bi-house"></i>
                        Главная
                    </a>
                </li>

                <li>
                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                        href="{% url 'about' %}"
                    >
                        <i class="bi bi-person"></i>
                        Обо мне
                    </a>
                </li>

                <li>
                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'resume' %}active{% endif %}"
                        href="{% url 'resume' %}"
                    >
                        <i class="bi bi-file-earmark-text navicon"></i>
                        Резюме
                    </a>
                </li>

                <li>
                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'portfolio_list' %}active{% endif %}"
                        href="{% url 'portfolio_list' %}"
                    >
                        <i class="bi bi-briefcase"></i>
                        Портфолио
                    </a>
                </li>

                <li>
                    <a
                        class="nav-link {% if request.resolver_match.url_name == 'contacts' %}active{% endif %}"
                        href="{% url 'contacts' %}"
                    >
                        <i class="bi bi-envelope"></i>
                        Контакты
                    </a>
                </li>
            </ul>
        </nav>
        <!-- Social media links -->
        <div class="social-links text-center">

            <a
                href="https://github.com/VVP04"
                class="github"
                title="GitHub"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="bi bi-github"></i>
            </a>

            <a
                href="https://t.me/plesov_v_v"
                class="telegram"
                title="Telegram"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="bi bi-telegram"></i>
            </a>

            <a
                href="https://www.linkedin.com/in/%D0%B2%D0%BB%D0%B0%D0%B4%D0%B8%D0%BC%D0%B8%D1%80-%D0%BF%D0%BB%D0%B5%D1%81%D0%BE%D0%B2%D1%81%D0%BA%D0%B8%D1%85-3150b742a/"
                class="linkedin"
                title="LinkedIn"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="bi bi-linkedin"></i>
            </a>

            <a
                href="https://max.ru/u/f9LHodD0cOK1rJ-GucDk64GaQrMWw4tDVJSalb3pgHkbBhkeGN-xf-8b7Z0"
                class="max"
                title="Max"
                target="_blank"
                rel="noopener noreferrer"
            >
                <img
                    src="{% static 'main/icons/Max_logo.svg' %}"
                    alt="MAX"
                >
            </a>
        </div>
    </aside>

    <!-- Main content -->
    <div class="main-content">

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            © {% now "Y" %} Владимир Плесовских
        </footer>

    </div>

    <!-- Bootstrap 5 JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
