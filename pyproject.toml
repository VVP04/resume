[project]
name = "resume"
version = "0.1.0"
description = "Resume website"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.7",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.0",
]

[tool.coverage.run]
omit = [
    "main/tests.py",
    "main/migrations/*",
]